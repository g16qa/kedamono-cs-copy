<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>CSコピー</title>
<style>
  :root { color-scheme: light dark; --accent: #2f7d5b; --warn: #b4552d; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 24px 16px; max-width: 720px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  #status { margin: 0 0 12px; font-size: 1.25rem; font-weight: 700; }
  #status.ok { color: var(--accent); }
  #status.wait { color: var(--warn); }
  #hint { margin: 0 0 16px; font-size: .9rem; opacity: .75; }
  button {
    font: inherit; font-weight: 700; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer;
  }
  textarea {
    display: block; width: 100%; height: 60vh; margin-top: 16px; padding: 12px;
    font: inherit; border: 1px solid #8884; border-radius: 8px; resize: vertical;
  }
</style>
</head>
<body>
<p id="status" role="status" aria-live="polite"></p>
<p id="hint"></p>
<button id="copy" type="button">もう一度コピー</button>
<textarea id="text" readonly aria-label="コピーする内容"></textarea>
<script>
  // 内容はURLの#以降だけに入るので、サーバーへは送信されない
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const button = document.getElementById('copy');
  const area = document.getElementById('text');

  function readHash() {
    const raw = location.hash.slice(1);
    try {
      return decodeURIComponent(raw);
    } catch {
      return null;
    }
  }

  function show(state, message, hint) {
    statusEl.className = state;
    statusEl.textContent = message;
    hintEl.textContent = hint;
  }

  function legacyCopy() {
    area.focus();
    area.select();
    try {
      return document.execCommand('copy');
    } catch {
      return false;
    }
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(area.value);
      return true;
    } catch {
      return legacyCopy();
    }
  }

  let copied = false;

  async function attempt() {
    copied = await copy();
    if (copied) {
      show('ok', 'コピーしました', 'このタブは閉じて大丈夫です。');
    } else {
      show('wait', 'まだコピーできていません', 'ブラウザの制限で自動コピーできませんでした。ページのどこかをクリックするとコピーします。');
    }
    return copied;
  }

  const text = readHash();
  if (text === null) {
    show('wait', 'リンクの内容を読み取れませんでした', 'Notionのコピー列からもう一度開いてください。');
    button.hidden = true;
    area.hidden = true;
  } else if (text === '') {
    show('wait', 'コピーする内容がありません', 'Notionのコピー列のリンクから開いてください。');
    button.hidden = true;
    area.hidden = true;
  } else {
    area.value = text;
    document.title = 'CSコピー: ' + text.split('\n')[0].replace(/^【[^】]*】/, '');
    button.addEventListener('click', attempt);
    // 自動コピーが拒否されたときの代替: タブのフォーカス時と最初のクリックで再試行する
    const retry = () => { if (!copied) attempt(); };
    window.addEventListener('focus', retry);
    document.addEventListener('pointerdown', (event) => {
      if (event.target !== button) retry();
    });
    attempt();
  }
</script>
</body>
</html>
