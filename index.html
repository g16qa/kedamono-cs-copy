<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>CSコピー</title>
<style>
  :root { color-scheme: light dark; --accent: #2f7d5b; --warn: #b4552d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0 auto; padding: 24px 16px; max-width: 720px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  #status { margin: 0 0 12px; font-size: 1.25rem; font-weight: 700; }
  #status.ok { color: var(--accent); }
  #status.wait { color: var(--warn); }
  #hint { margin: 0 0 16px; font-size: .9rem; opacity: .75; }
  button {
    font: inherit; font-weight: 700; color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer;
  }
  textarea, input {
    font: inherit; border: 1px solid #8884; border-radius: 8px;
  }
  textarea {
    display: block; width: 100%; height: 50vh; margin-top: 16px; padding: 12px; resize: vertical;
  }
  #settings { margin-top: 20px; }
  summary { cursor: pointer; font-weight: 700; }
  #settings form { margin-top: 12px; }
  #settings label { display: block; margin-bottom: 6px; font-size: .9rem; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; padding: 10px 12px; }
  .note { margin: 8px 0 0; font-size: .85rem; opacity: .75; }
  #settings-message { margin: 8px 0 0; font-size: .9rem; font-weight: 700; }
  #settings-message.error { color: var(--warn); }
</style>
</head>
<body>
<p id="status" role="status" aria-live="polite"></p>
<p id="hint"></p>
<button id="copy" type="button">もう一度コピー</button>
<textarea id="text" readonly aria-label="コピーする内容"></textarea>

<details id="settings">
  <summary>CS URLの設定</summary>
  <form id="settings-form">
    <label for="site">公開したNotionページのURL</label>
    <div class="row">
      <input id="site" type="text" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://example.notion.site/...">
      <button type="submit">保存</button>
    </div>
    <p id="settings-message" role="status" aria-live="polite"></p>
    <p class="note">公開ページのURLを1つ貼ると、どのキャラにも【CS URL】が付きます。空にして保存すると付かなくなります。</p>
    <p class="note">設定はこのブラウザだけに保存されます。公開していないキャラのURLは、他の人には開けません。</p>
  </form>
</details>

<script>
  // 内容はURLの#以降だけに入るので、サーバーへは送信されない
  // 新形式の#以降: 「ページID(32桁)」「改行」「本文」。ページIDがない形式もそのまま扱う
  const STORAGE_KEY = 'kedamono-cs-copy:site-origin';
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const button = document.getElementById('copy');
  const area = document.getElementById('text');
  const settings = document.getElementById('settings');
  const form = document.getElementById('settings-form');
  const siteInput = document.getElementById('site');
  const settingsMessage = document.getElementById('settings-message');

  function readHash() {
    const raw = location.hash.slice(1);
    let decoded;
    try {
      decoded = decodeURIComponent(raw);
    } catch {
      return null;
    }
    const match = decoded.match(/^([0-9a-f]{32})\n([\s\S]*)$/);
    return match ? { pageId: match[1], body: match[2] } : { pageId: null, body: decoded };
  }

  function loadOrigin() {
    try {
      return localStorage.getItem(STORAGE_KEY) || '';
    } catch {
      return '';
    }
  }

  function saveOrigin(origin) {
    try {
      if (origin) {
        localStorage.setItem(STORAGE_KEY, origin);
      } else {
        localStorage.removeItem(STORAGE_KEY);
      }
      return true;
    } catch {
      return false;
    }
  }

  // ページURL、ドメイン、example だけの入力を https の origin にそろえる。不正なら null
  function normalizeSite(input) {
    const value = input.trim();
    if (!value) return '';
    if (/^[a-z0-9-]+$/i.test(value)) return `https://${value.toLowerCase()}.notion.site`;
    try {
      const url = new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(value) ? value : `https://${value}`);
      if (url.protocol !== 'https:' || !url.hostname.includes('.')) return null;
      if (url.hostname === 'app.notion.com' || url.hostname.endsWith('notion.so')) return null;
      return url.origin;
    } catch {
      return null;
    }
  }

  function compose(page, origin) {
    if (!page.pageId || !origin) return page.body;
    return `${page.body}\n【CS URL】${origin}/${page.pageId}`;
  }

  function show(state, message, hint) {
    statusEl.className = state;
    statusEl.textContent = message;
    hintEl.textContent = hint;
  }

  function legacyCopy() {
    area.focus();
    area.select();
    try {
      return document.execCommand('copy');
    } catch {
      return false;
    }
  }

  async function copy() {
    try {
      await navigator.clipboard.writeText(area.value);
      return true;
    } catch {
      return legacyCopy();
    }
  }

  let copied = false;

  async function attempt() {
    copied = await copy();
    if (copied) {
      show('ok', 'コピーしました', 'このタブは閉じて大丈夫です。');
    } else {
      show('wait', 'まだコピーできていません', 'ブラウザの制限で自動コピーできませんでした。ページのどこかをクリックするとコピーします。');
    }
    return copied;
  }

  const page = readHash();
  const hasContent = Boolean(page && page.body);
  siteInput.value = loadOrigin();

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const origin = normalizeSite(siteInput.value);
    if (origin === null) {
      settingsMessage.className = 'error';
      settingsMessage.textContent = 'notion.site などの公開URLを入れてください。編集画面のURLは使えません。';
      return;
    }
    if (!saveOrigin(origin)) {
      settingsMessage.className = 'error';
      settingsMessage.textContent = 'このブラウザでは設定を保存できませんでした。';
      return;
    }
    siteInput.value = origin;
    settingsMessage.className = '';
    if (hasContent) {
      area.value = compose(page, origin);
      await attempt();
      settingsMessage.textContent = origin ? '保存して、CS URL付きでコピーし直しました。' : '保存して、CS URLなしでコピーし直しました。';
    } else {
      settingsMessage.textContent = origin ? '保存しました。' : 'CS URLの設定を消しました。';
    }
  });

  if (page === null) {
    show('wait', 'リンクの内容を読み取れませんでした', 'Notionのコピー列からもう一度開いてください。');
    button.hidden = true;
    area.hidden = true;
    settings.hidden = true;
  } else if (!hasContent) {
    show('', 'CS URLの設定', 'Notionのコピー列のリンクを開くと、CSをコピーできます。');
    button.hidden = true;
    area.hidden = true;
    settings.open = true;
  } else {
    // 古い形式のリンクはページIDを持たないので、設定欄は出さない
    settings.hidden = !page.pageId;
    area.value = compose(page, loadOrigin());
    document.title = 'CSコピー: ' + page.body.replace(/^```\n/, '').split('\n')[0].replace(/^【[^】]*】/, '');
    button.addEventListener('click', attempt);
    // 自動コピーが拒否されたときの代替: タブのフォーカス時と最初のクリックで再試行する
    const retry = () => { if (!copied) attempt(); };
    window.addEventListener('focus', retry);
    document.addEventListener('pointerdown', (event) => {
      if (event.target !== button && !settings.contains(event.target)) retry();
    });
    attempt();
  }
</script>
</body>
</html>
